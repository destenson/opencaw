[package]
name = "caw-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "caw-bench"
path = "src/main.rs"

[[bin]]
name = "caw-bench-sweep"
path = "src/bin/sweep.rs"

[[bin]]
name = "caw-bench-build-index"
path = "src/bin/build_index.rs"

[[bin]]
name = "caw-bench-intent"
path = "src/bin/intent_bench.rs"

[[bin]]
name = "caw-bench-tune"
path = "src/bin/tune.rs"

[[bin]]
name = "caw-bench-coop"
path = "src/bin/coop.rs"

# Throwaway feasibility probe: concept-vector-as-embedding vs BGE on the sysdoc set.
# See concept_mistral.rs / src/bin/concept_vector_probe.rs. Not part of the bench suite.
[[bin]]
name = "caw-bench-concept-probe"
path = "src/bin/concept_vector_probe.rs"

[[bin]]
name = "caw-bench-graph-eval"
path = "src/bin/graph_eval.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
toml = "0.8"
sha2 = "0.11"
caw-core = { path = "../caw-core" }
caw-adapters = { path = "../caw-adapters", features = ["cli"] }
caw-ingest = { path = "../caw-ingest" }
caw-index = { path = "../caw-index", features = ["candle", "onnx"] }
caw-orchestrator = { path = "../caw-orchestrator" }
caw-eval = { path = "../caw-eval" }
rayon.workspace = true
walkdir = "2"
tempfile = "3"
# Concept-vector probe only. Versions pinned to match caw-index's candle stack
# so the workspace resolves one copy of each (no duplicate onnxruntime/candle builds).
candle-core = { version = "0.10", features = ["cuda"] }
candle-nn = { version = "0.10", features = ["cuda"] }
candle-transformers = { version = "0.10", features = ["cuda"] }
hf-hub = "0.5"
tokenizers = "0.21"
