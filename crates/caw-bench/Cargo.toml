[package]
name = "caw-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "caw-bench"
path = "src/main.rs"

[[bin]]
name = "caw-bench-sweep"
path = "src/bin/sweep.rs"

[[bin]]
name = "caw-bench-build-index"
path = "src/bin/build_index.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
toml = "0.8"
sha2 = "0.11"
caw-core = { path = "../caw-core" }
caw-adapters = { path = "../caw-adapters" }
caw-ingest = { path = "../caw-ingest" }
caw-index = { path = "../caw-index", features = ["candle", "onnx"] }
caw-orchestrator = { path = "../caw-orchestrator" }
caw-eval = { path = "../caw-eval" }
rayon.workspace = true
walkdir = "2"
tempfile = "3"
