[package]
name = "caw-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
caw-core = { workspace = true }
caw-ingest = { workspace = true }

# Embedding backends
fastembed = { version = "5", optional = true }
# ort conflicts with fastembed's ort dependency (both link onnxruntime native lib),
# so the onnx and fastembed features are mutually exclusive at link time.
# Pinned to match fastembed's ort dependency so workspace resolution succeeds.
# `download-binaries` auto-fetches a CPU onnxruntime; `cuda` adds the CUDA
# execution provider API (requires a CUDA-capable onnxruntime at runtime —
# either manually installed onnxruntime-gpu or via ORT_DYLIB_PATH).
ort = { version = "=2.0.0-rc.10", optional = true, features = ["load-dynamic", "cuda"] }
ndarray = { version = "0.16", optional = true }
candle-core = { version = "0.10", optional = true, features = ["cuda"] }
candle-nn = { version = "0.10", optional = true, features = ["cuda"] }
candle-transformers = { version = "0.10", optional = true, features = ["cuda"] }
hf-hub = { version = "0.5", optional = true }
tokenizers = { version = "0.21", optional = true }
libloading = { version = "0.8", optional = true }

# Vector storage backends
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
qdrant-client = { version = "1", optional = true }

# Vector index
instant-distance = "0.6"

# Async runtime (needed by qdrant-client)
tokio = { workspace = true, optional = true }

# Common utilities
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = ["fastembed", "sqlite"]
fastembed = ["dep:fastembed", "dep:libloading"]
onnx = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:hf-hub", "dep:libloading"]
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers"]
sqlite = ["dep:rusqlite"]
qdrant = ["dep:qdrant-client", "dep:tokio"]

