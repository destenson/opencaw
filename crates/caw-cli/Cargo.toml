[package]
name = "caw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
llama = ["caw-adapters/llama"]

[dependencies]
anyhow.workspace = true
caw-adapters = { workspace = true, features = ["cli"] }
caw-core = { workspace = true }
caw-curation = { workspace = true }
caw-index = { workspace = true }
caw-ingest = { workspace = true }
caw-orchestrator = { workspace = true }
caw-transform = { workspace = true }
clap = { version = "4", features = ["derive"] }
rustyline = "18"
tracing.workspace = true
tracing-subscriber.workspace = true
