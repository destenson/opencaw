[package]
name = "caw-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# caw-cli is the recall engine; caw-graph-ingest is a one-shot sidecar tool.
# Without this, adding the second binary made `cargo run -p caw-cli` ambiguous.
default-run = "caw-cli"

[features]
llama = ["caw-adapters/llama"]
# Forward the orchestrator's opt-in session-recall subsystem. Off by default:
# session recall injects compressed prior-session answers into the workspace,
# which contaminates test runs. Enable to restore session-history recording and
# recall.
session-recall = ["caw-orchestrator/session-recall"]

[dependencies]
anyhow.workspace = true
caw-adapters = { workspace = true, features = ["cli"] }
caw-core = { workspace = true }
caw-curation = { workspace = true }
# candle backs the CLI embedder: onnxruntime's prebuilt CUDA provider silently
# falls back to CPU on this hardware, candle runs on GPU. Defaults (fastembed,
# sqlite) stay enabled for the rest of the workspace; the CLI just no longer
# constructs the fastembed provider, so onnxruntime never loads at runtime.
caw-index = { workspace = true, features = ["candle"] }
caw-ingest = { workspace = true }
caw-orchestrator = { workspace = true }
caw-transform = { workspace = true }
clap = { version = "4", features = ["derive"] }
rustyline = "18"
serde = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
